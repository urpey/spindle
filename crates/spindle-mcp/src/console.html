<!doctype html>
<!--
  Spindle Operator Console: one embedded HTML file, native CSS/JS, no external
  requests or build step. GET read models remain compatible. All actions and
  new reads use /console/mcp: the normal MCP session, project locks and service
  validation, with a fixed console tool set independent of SPINDLE_TOOL_PROFILE. Release snapshots stay local; no platform posting.
-->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spindle Operator Console</title>
<style>
  :root {
    --bg: #14161a; --panel: #1c1f26; --panel2: #23272f; --line: #313742;
    --fg: #d7dbe2; --dim: #8b93a1; --accent: #6ea8fe; --ok: #5cd18b;
    --warn: #e0b64a; --err: #e56b6b; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.5 system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
  }
  header {
    display: flex; align-items: center; gap: 16px; padding: 10px 16px;
    background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header .badge {
    font: 11px var(--mono); color: var(--dim); border: 1px solid var(--line);
    border-radius: 4px; padding: 2px 6px;
  }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  nav button[aria-pressed="true"] { background: var(--accent); color: #0c0f14; border-color: var(--accent); }
  .lang-switch { display: flex; gap: 2px; border: 1px solid var(--line); border-radius: 6px; padding: 2px; margin-left: auto; }
  .lang-switch button { background: transparent; border: 0; color: var(--dim); font-size: 12px; padding: 4px 8px; border-radius: 4px; min-height: 0; }
  .lang-switch button[aria-pressed="true"] { background: var(--panel2); color: var(--fg); }
  header { position: relative; }
  button.help {
    background: transparent; color: var(--dim); border: 1px solid var(--line);
    border-radius: 50%; width: 24px; min-width: 24px; height: 24px; min-height: 0;
    padding: 0; font: 700 12px/1 var(--mono);
  }
  button.help:hover, button.help[aria-expanded="true"] { color: var(--fg); border-color: var(--accent); }
  .help-popover {
    position: absolute; top: calc(100% + 6px); right: 16px; z-index: 20;
    width: min(420px, calc(100vw - 32px)); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px;
    box-shadow: 0 10px 28px rgba(0, 0, 0, .45);
  }
  .help-popover h2 { font-size: 15px; margin: 0 0 6px; }
  .help-popover p { margin: 0; font-size: 13px; color: var(--dim); }
  .help-popover ul { margin: 10px 0 12px; padding-left: 18px; font-size: 13px; color: var(--dim); }
  .help-popover li { margin-bottom: 5px; }
  .help-popover strong { color: var(--fg); }
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  label { color: var(--dim); font-size: 12px; }
  select, input[type=number] {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 10px; font-size: 13px; min-width: 120px;
  }
  button.refresh {
    background: var(--panel2); color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; font-size: 13px;
  }
  .pane { display: none; }
  .pane.active { display: block; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
  .muted { color: var(--dim); }
  .err { color: var(--err); }
  .empty { color: var(--dim); font-style: italic; padding: 12px 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: 12px; }
  .pill {
    display: inline-block; font: 11px var(--mono); padding: 1px 7px; border-radius: 10px;
    border: 1px solid var(--line); color: var(--dim);
  }
  .pill.pending { color: var(--dim); }
  .pill.draft_saved, .pill.in_progress { color: var(--accent); border-color: var(--accent); }
  .pill.changes_committed, .pill.beats_annotated, .pill.complete, .pill.completed, .pill.clean, .pill.staged { color: var(--ok); border-color: var(--ok); }
  .pill.blocked, .pill.findings, .pill.error, .pill.skipped { color: var(--err); border-color: var(--err); }
  .pill.high { color: var(--ok); } .pill.medium { color: var(--warn); } .pill.low { color: var(--dim); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
  .scene-cell { border: 1px solid var(--line); border-radius: 6px; padding: 8px; background: var(--panel2); font-size: 12px; }
  .scene-cell .lbl { font: 12px var(--mono); color: var(--fg); margin-bottom: 4px; }
  .kv { color: var(--dim); font-size: 11px; }
  pre.reading {
    white-space: pre-wrap; word-break: break-word; background: var(--panel2);
    border: 1px solid var(--line); border-radius: 8px; padding: 16px;
    font: 13px/1.6 Georgia, "Times New Roman", serif; max-height: 70vh; overflow: auto;
  }
  .md h1 { font-size: 20px; margin: 18px 0 8px; }
  .md h2 { font-size: 17px; margin: 16px 0 6px; }
  .md h3 { font-size: 15px; margin: 14px 0 6px; }
  .md p { margin: 8px 0; }
  .evidence { font-style: italic; color: var(--dim); border-left: 2px solid var(--line); padding-left: 8px; margin: 4px 0; }
  pre.payload { white-space: pre-wrap; word-break: break-word; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 8px; font: 11px var(--mono); color: var(--dim); margin: 4px 0 0; max-height: 220px; overflow: auto; }
  .note { background: #201d14; border: 1px solid var(--warn); color: var(--warn); border-radius: 6px; padding: 8px 12px; font-size: 12px; margin-bottom: 12px; }
  #timeline { max-height: 320px; overflow: auto; font: 12px var(--mono); }
  .ev { padding: 4px 8px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; }
  .ev .seq { color: var(--dim); min-width: 42px; }
  .ev .kind { color: var(--accent); min-width: 180px; }
  .ev .pl { color: var(--fg); word-break: break-word; }
  .ev .as { color: var(--warn); white-space: nowrap; }
  .ev.unknown .kind { color: var(--warn); }
  .sse-state { font: 11px var(--mono); color: var(--dim); margin-left: 8px; }

  :root { color-scheme: dark; }
  ::selection { background: var(--accent); color: var(--bg); }
  h2 { font-size: 22px; line-height: 1.25; margin: 22px 0 8px; }
  h3 { font-size: 16px; margin: 0 0 8px; }
  p { max-width: 72ch; }
  button, select, input, textarea { font: inherit; }
  button { background: var(--panel2); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; min-height: 36px; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:active:not(:disabled) { background: var(--bg); }
  button:disabled { opacity: .55; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  textarea { display: block; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 6px; padding: 10px; width: 100%; min-height: 80px; resize: vertical; caret-color: var(--accent); }
  textarea::placeholder { color: var(--dim); }
  button.primary { background: var(--accent); color: #0c0f14; border-color: var(--accent); }
  .work-item { padding: 20px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; }
  .table-scroll { overflow-x: auto; }
  .episode-title { min-width: 170px; }
  .table-scroll td { padding-block: 12px; }
  .series-summary { padding: 14px 0; border-block: 1px solid var(--line); }
  .series-summary strong { color: var(--fg); }
  .episode-detail { margin-top: 24px; padding-top: 8px; border-top: 1px solid var(--line); }
  .md { max-width: 72ch; font: 17px/1.7 Georgia, serif; margin: 20px auto; overflow-wrap: anywhere; }
  .preview-prose { max-height: 60vh; overflow-y: auto; padding: 0 16px; border: 1px solid var(--line); }
  details { margin-block: 14px; }
  summary { cursor: pointer; color: var(--fg); min-height: 32px; }
  .evidence { border-left-width: 1px; }
  .err, .note, #feedback { overflow-wrap: anywhere; }
  #feedback:empty { display: none; }
  #feedback { max-width: none; padding: 12px; border: 1px solid var(--line); background: var(--panel); }
  header { flex-wrap: wrap; }
  nav { flex-wrap: wrap; }
  select { max-width: 100%; }
  .loading { min-height: 90px; color: var(--dim); padding-block: 16px; }
  @media (max-width: 760px) {
    header { gap: 10px; } nav { margin-left: 0; width: 100%; gap: 6px; }
    nav button { flex: 1 0 auto; min-height: 42px; }
    main { padding: 14px; }
    .row { gap: 8px; } .row select { flex: 1 1 160px; min-width: 0; }
    .row select[id$="-project"] { flex-basis: calc(100% - 65px); }
    button { min-height: 42px; } .ev { flex-wrap: wrap; }
    .episode-table thead { display: none; }
    .episode-table tr { display: block; padding: 14px 0; border-bottom: 1px solid var(--line); }
    .episode-table td { display: block; padding: 4px 0; border: 0; }
    .preview-prose { padding-inline: 10px; }
  }
</style>
</head>
<body>
<header>
  <h1 data-i18n="app.title">Spindle Operator Console</h1>
  <span class="badge" data-i18n="app.badge">local workspace</span>
  <button type="button" class="help" data-help="help-nav" aria-expanded="false" aria-controls="help-nav" data-i18n-aria-label="help.button">!</button>
  <div class="lang-switch" role="group" data-i18n-aria-label="lang.label" aria-label="Language">
    <button type="button" class="lang" data-lang="zh-TW" aria-pressed="true">繁體中文</button>
    <button type="button" class="lang" data-lang="en" aria-pressed="false">English</button>
  </div>
  <nav data-i18n-aria-label="nav.label" aria-label="Workspace">
    <button data-pane="series" aria-pressed="true" data-i18n="nav.series">Series</button>
    <button data-pane="editorial" aria-pressed="false" data-i18n="nav.editorial">Editorial</button>
    <button data-pane="threads" aria-pressed="false" data-i18n="nav.threads">Threads</button>
    <button data-pane="runs" aria-pressed="false" data-i18n="nav.runs">Runs</button>
    <button data-pane="manuscript" aria-pressed="false" data-i18n="nav.manuscript">Manuscript</button>
    <button data-pane="canon" aria-pressed="false" data-i18n="nav.canon">Canon queue</button>
    <button data-pane="plan" aria-pressed="false" data-i18n="nav.plan">Plan queue</button>
    <button data-pane="settings" aria-pressed="false" data-i18n="nav.settings"></button>
  </nav>
  <div class="help-popover" id="help-nav" role="dialog" aria-labelledby="help-nav-title" hidden>
    <h2 id="help-nav-title" data-i18n="help.nav.title">What this console is</h2>
    <p data-i18n="help.nav.intro"></p>
    <ul>
      <li><strong data-i18n="nav.series"></strong> — <span data-i18n="help.nav.series"></span></li>
      <li><strong data-i18n="nav.editorial"></strong> — <span data-i18n="help.nav.editorial"></span></li>
      <li><strong data-i18n="nav.threads"></strong> — <span data-i18n="help.nav.threads"></span></li>
      <li><strong data-i18n="nav.runs"></strong> — <span data-i18n="help.nav.runs"></span></li>
      <li><strong data-i18n="nav.manuscript"></strong> — <span data-i18n="help.nav.manuscript"></span></li>
      <li><strong data-i18n="nav.canon"></strong> — <span data-i18n="help.nav.canon"></span></li>
      <li><strong data-i18n="nav.plan"></strong> — <span data-i18n="help.nav.plan"></span></li>
      <li><strong data-i18n="nav.settings"></strong> — <span data-i18n="help.nav.settings"></span></li>
    </ul>
    <button type="button" class="help-close" data-i18n="help.close">Close</button>
  </div>
</header>
<main>
  <p id="feedback" role="status" aria-live="polite"></p>
  <section id="pane-series" class="pane active" data-i18n-aria-label="nav.series" aria-label="Series">
    <div class="row">
      <label for="series-project" data-i18n="common.project"></label><select id="series-project"></select>
      <button class="refresh" id="series-refresh" data-i18n="series.refresh"></button>
      <button type="button" class="help" data-help="help-series-episodes" aria-expanded="false" aria-controls="help-series-episodes" data-i18n-aria-label="help.series.episodes.title">!</button>
    </div>
    <h2 data-i18n="series.title"></h2>
    <p class="muted" data-i18n="series.intro"></p>
    <div id="series-out" aria-live="polite"></div>
    <div id="episode-detail"></div>
    <details id="usage"><summary><span data-i18n="series.usage"></span>
      <button type="button" class="help" data-help="help-series-usage" aria-expanded="false" aria-controls="help-series-usage" data-i18n-aria-label="help.series.usage.title">!</button>
    </summary><div id="usage-out"></div></details>
    <div class="help-popover" id="help-series-episodes" role="dialog" aria-labelledby="help-series-episodes-title" hidden>
      <h2 id="help-series-episodes-title" data-i18n="help.series.episodes.title"></h2>
      <p data-i18n="help.series.episodes.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-series-release" role="dialog" aria-labelledby="help-series-release-title" hidden>
      <h2 id="help-series-release-title" data-i18n="help.series.release.title"></h2>
      <p data-i18n="help.series.release.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-series-review" role="dialog" aria-labelledby="help-series-review-title" hidden>
      <h2 id="help-series-review-title" data-i18n="help.series.review.title"></h2>
      <p data-i18n="help.series.review.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-series-usage" role="dialog" aria-labelledby="help-series-usage-title" hidden>
      <h2 id="help-series-usage-title" data-i18n="help.series.usage.title"></h2>
      <p data-i18n="help.series.usage.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
  </section>
  <section id="pane-editorial" class="pane" data-i18n-aria-label="nav.editorial" aria-label="Editorial">
    <div class="row">
      <label for="editorial-project" data-i18n="common.project"></label><select id="editorial-project"></select>
      <label for="editorial-filter" data-i18n="editorial.filterLabel"></label><select id="editorial-filter">
        <option value="" data-i18n="editorial.filterAll"></option>
        <option value="open" data-i18n="editorial.filterOpen"></option>
        <option value="accepted" data-i18n="editorial.filterAccepted"></option>
        <option value="deferred" data-i18n="editorial.filterDeferred"></option>
        <option value="resolved" data-i18n="editorial.filterResolved"></option>
        <option value="dismissed" data-i18n="editorial.filterDismissed"></option>
      </select><button class="refresh" id="editorial-refresh" data-i18n="editorial.refresh"></button>
      <button type="button" class="help" data-help="help-editorial-queue" aria-expanded="false" aria-controls="help-editorial-queue" data-i18n-aria-label="help.editorial.queue.title">!</button>
    </div>
    <h2><span data-i18n="editorial.title"></span>
      <button type="button" class="help" data-help="help-editorial-decisions" aria-expanded="false" aria-controls="help-editorial-decisions" data-i18n-aria-label="help.editorial.decisions.title">!</button></h2>
    <p class="muted" data-i18n="editorial.intro"></p>
    <div id="editorial-out" aria-live="polite"></div>
    <div class="help-popover" id="help-editorial-queue" role="dialog" aria-labelledby="help-editorial-queue-title" hidden>
      <h2 id="help-editorial-queue-title" data-i18n="help.editorial.queue.title"></h2>
      <p data-i18n="help.editorial.queue.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-editorial-decisions" role="dialog" aria-labelledby="help-editorial-decisions-title" hidden>
      <h2 id="help-editorial-decisions-title" data-i18n="help.editorial.decisions.title"></h2>
      <p data-i18n="help.editorial.decisions.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
  </section>
  <section id="pane-threads" class="pane" data-i18n-aria-label="nav.threads" aria-label="Threads">
    <div class="row"><label for="threads-project" data-i18n="common.project"></label><select id="threads-project"></select>
      <button class="refresh" id="threads-refresh" data-i18n="threads.refresh"></button>
      <button type="button" class="help" data-help="help-threads-payoffs" aria-expanded="false" aria-controls="help-threads-payoffs" data-i18n-aria-label="help.threads.payoffs.title">!</button></div>
    <h2 data-i18n="threads.title"></h2>
    <p class="muted" data-i18n="threads.intro"></p>
    <div id="threads-out" aria-live="polite"></div>
    <div class="help-popover" id="help-threads-promises" role="dialog" aria-labelledby="help-threads-promises-title" hidden>
      <h2 id="help-threads-promises-title" data-i18n="help.threads.promises.title"></h2>
      <p data-i18n="help.threads.promises.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-threads-plotlines" role="dialog" aria-labelledby="help-threads-plotlines-title" hidden>
      <h2 id="help-threads-plotlines-title" data-i18n="help.threads.plotLines.title"></h2>
      <p data-i18n="help.threads.plotLines.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-threads-arcs" role="dialog" aria-labelledby="help-threads-arcs-title" hidden>
      <h2 id="help-threads-arcs-title" data-i18n="help.threads.arcs.title"></h2>
      <p data-i18n="help.threads.arcs.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-threads-motifs" role="dialog" aria-labelledby="help-threads-motifs-title" hidden>
      <h2 id="help-threads-motifs-title" data-i18n="help.threads.motifs.title"></h2>
      <p data-i18n="help.threads.motifs.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-threads-payoffs" role="dialog" aria-labelledby="help-threads-payoffs-title" hidden>
      <h2 id="help-threads-payoffs-title" data-i18n="help.threads.payoffs.title"></h2>
      <p data-i18n="help.threads.payoffs.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
  </section>

  <!-- ── Runs ─────────────────────────────────────────────────────────── -->
  <section id="pane-runs" class="pane" data-i18n-aria-label="nav.runs" aria-label="Runs">
    <div class="row">
      <label for="runs-project" data-i18n="common.project"></label>
      <select id="runs-project"></select>
      <button class="refresh" id="runs-refresh" data-i18n="runs.refresh"></button>
      <button type="button" class="help" data-help="help-runs-grid" aria-expanded="false" aria-controls="help-runs-grid" data-i18n-aria-label="help.runs.grid.title">!</button>
    </div>
    <div class="card" id="runs-status"><div class="empty" data-i18n="common.pickProject"></div></div>
    <div class="card">
      <div class="row" style="margin-bottom:6px">
        <strong data-i18n="runs.timeline"></strong>
        <button type="button" class="help" data-help="help-runs-timeline" aria-expanded="false" aria-controls="help-runs-timeline" data-i18n-aria-label="help.runs.timeline.title">!</button>
        <span class="muted"> · <span data-i18n="runs.antiSlop"></span></span>
        <span class="muted" data-i18n="runs.antiSlopHint"></span>
        <span class="sse-state" id="sse-state" data-i18n="runs.sseIdle"></span>
      </div>
      <div id="timeline"><div class="empty" data-i18n="runs.noRunSelected"></div></div>
    </div>
    <div class="help-popover" id="help-runs-grid" role="dialog" aria-labelledby="help-runs-grid-title" hidden>
      <h2 id="help-runs-grid-title" data-i18n="help.runs.grid.title"></h2>
      <p data-i18n="help.runs.grid.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-runs-checkpoints" role="dialog" aria-labelledby="help-runs-checkpoints-title" hidden>
      <h2 id="help-runs-checkpoints-title" data-i18n="help.runs.checkpoints.title"></h2>
      <p data-i18n="help.runs.checkpoints.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
    <div class="help-popover" id="help-runs-timeline" role="dialog" aria-labelledby="help-runs-timeline-title" hidden>
      <h2 id="help-runs-timeline-title" data-i18n="help.runs.timeline.title"></h2>
      <p data-i18n="help.runs.timeline.body"></p>
      <button type="button" class="help-close" data-i18n="help.close"></button>
    </div>
  </section>

  <!-- ── Manuscript ───────────────────────────────────────────────────── -->

<script>
"use strict";
// All state is module-local; no framework, no build. Every render path handles
// the empty and error cases so a failed fetch never blanks a pane (defensive
// rendering is the compensating control for having no JS test harness).

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? "" : s)
  .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
  .replace(/"/g, "&quot;");

// ── Language ─────────────────────────────────────────────────────────────
// Console copy lives in one per-language catalog in this file; Traditional
// Chinese is the fixed default, English is opt-in and remembered per browser.
const DEFAULT_LANG = "zh-TW";
const LANG_KEY = "spindle.console.lang";
const CATALOG = JSON.parse($("i18n-catalog").textContent);
let lang = DEFAULT_LANG, booted = false;
function t(key) {
  const active = CATALOG[lang] || {};
  const fallback = CATALOG.en || {};
  if (Object.prototype.hasOwnProperty.call(active, key)) return active[key];
  if (Object.prototype.hasOwnProperty.call(fallback, key)) return fallback[key];
  return key;
}
function tf(key, params) {
  return t(key).replace(/\{(\w+)\}/g, (_, name) => String(params[name] == null ? "" : params[name]));
}
// Data values arrive in English enums; show the catalog label when we have one
// and fall back to the value itself so unknown data is never hidden.
function statusLabel(value) {
  const key = "status." + String(value == null ? "" : value).toLowerCase();
  const active = CATALOG[lang] || {};
  const fallback = CATALOG.en || {};
  if (Object.prototype.hasOwnProperty.call(active, key)) return active[key];
  if (Object.prototype.hasOwnProperty.call(fallback, key)) return fallback[key];
  return value;
}
function storedLang() {
  try {
    const saved = localStorage.getItem(LANG_KEY);
    return saved && CATALOG[saved] ? saved : DEFAULT_LANG;
  } catch (_error) { return DEFAULT_LANG; }
}
function applyLanguage() {
  document.documentElement.lang = lang === "zh-TW" ? "zh-Hant" : "en";
  document.querySelectorAll("[data-i18n]").forEach((node) => {
    node.textContent = t(node.dataset.i18n);
  });
  document.querySelectorAll("[data-i18n-aria-label]").forEach((node) => {
    node.setAttribute("aria-label", t(node.dataset.i18nAriaLabel));
  });
  document.querySelectorAll("[data-lang]").forEach((node) => {
    node.setAttribute("aria-pressed", String(node.dataset.lang === lang));
  });
  document.title = t("app.title");
  // Already-rendered dynamic content must follow the switch too.
  if (booted) {
    const render = paneRenderers[activePane];
    if (render) render();
  }
}
function setLanguage(next) {
  if (!CATALOG[next] || next === lang) return;
  lang = next;
  try { localStorage.setItem(LANG_KEY, next); } catch (_error) { /* storage may be blocked */ }
  applyLanguage();
}
document.querySelectorAll("[data-lang]").forEach((node) =>
  node.addEventListener("click", () => setLanguage(node.dataset.lang)));

// ── Help notices ─────────────────────────────────────────────────────────
// A "!" button per feature opens a short tutorial. A native <button> gives
// Enter and Space for free; Escape, an outside click and the close button all
// dismiss it through closeHelp(), and focus returns to the trigger so keyboard
// and screen-reader users never lose their place.
let openHelp = null;
function closeHelp(returnFocus = true) {
  if (!openHelp) return;
  const { trigger, popover } = openHelp;
  popover.hidden = true;
  trigger.setAttribute("aria-expanded", "false");
  openHelp = null;
  if (returnFocus) trigger.focus();
}
// Delegated, because tutorials are attached to rows and groups that render later.
function helpButton(id, labelKey) {
  return `<button type="button" class="help" data-help="${id}" aria-expanded="false" aria-controls="${id}" aria-label="${esc(t(labelKey))}">!</button>`;
}
document.addEventListener("click", (event) => {
  const trigger = event.target.closest("[data-help]");
  if (trigger) {
    event.preventDefault();
    event.stopPropagation();
    const popover = $(trigger.dataset.help);
    if (!popover) return;
    if (openHelp && openHelp.popover === popover) { closeHelp(); return; }
    closeHelp(false);
    popover.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    openHelp = { trigger, popover };
    const close = popover.querySelector(".help-close");
    (close || popover).focus();
    return;
  }
  if (!openHelp) return;
  if (openHelp.popover.contains(event.target) || openHelp.trigger.contains(event.target)) return;
  closeHelp(false);
});
document.addEventListener("click", (event) => {
  if (event.target.closest(".help-close")) closeHelp();
});
document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && openHelp) closeHelp();
});

// GET a JSON endpoint; throws on non-2xx so callers render an error state.
async function getJSON(path) {
  const res = await fetch(path, { headers: { "accept": "application/json" } });
  if (!res.ok) {
    const text = await res.text().catch(() => "");
    throw new Error(`${res.status} ${res.statusText}${text ? " — " + text : ""}`);
  }
  return res.json();
}

// A single native MCP session shared by the console. Never automatically replay
// a failed write: the user reloads its source before trying again.
let mcpReady = null, mcpSession = null, mcpVersion = "2025-03-26", rpcId = 0;
async function rpc(method, params, initialize = false) {
  const id = ++rpcId;
  const headers = {"Content-Type":"application/json", "Accept":"application/json, text/event-stream"};
  if (mcpSession) headers["Mcp-Session-Id"] = mcpSession;
  if (!initialize) headers["MCP-Protocol-Version"] = mcpVersion;
  const res = await fetch("/console/mcp", {method:"POST", headers, body:JSON.stringify({jsonrpc:"2.0", id, method, params}), signal:AbortSignal.timeout(300000)});
  if (!res.ok) {
    if (res.status === 404) { mcpReady = null; mcpSession = null; }
    throw new Error(`Request failed (${res.status}). Refresh the view before retrying.`);
  }
  if (initialize) mcpSession = res.headers.get("Mcp-Session-Id");
  let message;
  if ((res.headers.get("content-type") || "").includes("text/event-stream")) {
    const reader = res.body.getReader(), decoder = new TextDecoder();
    let buffer = "";
    try {
      while (!message) {
        const {value, done} = await reader.read();
        buffer += decoder.decode(value || new Uint8Array(), {stream:!done});
        let match;
        while ((match = /\r?\n\r?\n/.exec(buffer))) {
          const frame = buffer.slice(0, match.index); buffer = buffer.slice(match.index + match[0].length);
          const data = frame.split(/\r?\n/).filter(l => l.startsWith("data:")).map(l => l.slice(5).trimStart()).join("\n");
          if (!data) continue;
          const parsed = JSON.parse(data);
          if (parsed.id === id) { message = parsed; break; }
        }
        if (done && !message) throw new Error("Connection ended before the result. Refresh before retrying.");
      }
    } finally { await reader.cancel(); }
  } else { message = await res.json(); }
  if (message.error) throw new Error(message.error.message || "Spindle rejected this request.");
  return message.result;
}
async function readyMcp() {
  if (!mcpReady) mcpReady = (async () => {
    const result = await rpc("initialize", {protocolVersion:mcpVersion, capabilities:{}, clientInfo:{name:"spindle-console", version:"2"}}, true);
    mcpVersion = result.protocolVersion;
    const headers = {"Content-Type":"application/json", "Accept":"application/json, text/event-stream", "MCP-Protocol-Version":mcpVersion};
    if (mcpSession) headers["Mcp-Session-Id"] = mcpSession;
    const response = await fetch("/console/mcp", {method:"POST", headers, body:JSON.stringify({jsonrpc:"2.0", method:"notifications/initialized"})});
    if (!response.ok) throw new Error("Could not initialize Spindle. Refresh the page.");
  })().catch(error => { mcpReady = null; mcpSession = null; throw error; });
  return mcpReady;
}
async function callTool(name, args) {
  await readyMcp();
  const result = await rpc("tools/call", {name, arguments:args});
  if (result.isError) throw new Error((result.content || []).map(c => c.text || "").join("\n"));
  if (result.structuredContent) return result.structuredContent;
  return JSON.parse((result.content || []).find(c => c.type === "text")?.text || "{}");
}
async function readResource(uri) {
  await readyMcp();
  const result = await rpc("resources/read", {uri});
  return JSON.parse(result.contents.find(c => c.text != null).text);
}
function feedback(message, error = false) {
  $("feedback").textContent = message; $("feedback").className = error ? "err" : "";
}
async function perform(button, work) {
  if (button.disabled) return;
  const label = button.textContent;
  button.disabled = true; button.textContent = t("common.working");
  try { await work(); }
  catch (error) { feedback(error.message || String(error), true); }
  finally { button.disabled = false; button.textContent = label; }
}
const projectPickers = ["series", "editorial", "threads", "runs", "ms", "canon", "plan"];
let activePane = "series", seriesOffset = 0, editorialOffset = 0;
const renderEpoch = {};
function loading(id, text) {
  const epoch = (renderEpoch[id] || 0) + 1; renderEpoch[id] = epoch;
  $(id).innerHTML = `<div class="loading" role="status">${esc(text)}</div>`;
  return () => renderEpoch[id] === epoch;
}

function errorHTML(where, err) {
  const detail = (err && err.message) || err;
  return `<div class="err" role="alert">${esc(tf("common.errorPrefix", {where, error: detail}))}</div>`;
}

function pill(text) {
  const cls = String(text || "").toLowerCase().replace(/[^a-z_]/g, "");
  return `<span class="pill ${esc(cls)}">${esc(statusLabel(text))}</span>`;
}

// ── Project pickers (shared) ─────────────────────────────────────────────
// Each pane has its own <select>; they load independently so one pane's fetch
// failure never breaks the others.
async function loadProjects(selectId, onChange) {
  const sel = $(selectId);
  try {
    const data = await getJSON("/console/api/projects");
    const projects = (data && data.projects) || [];
    if (!projects.length) {
      sel.innerHTML = `<option value="">(no projects)</option>`;
      return [];
    }
    sel.innerHTML = projects
      .map((p) => `<option value="${esc(p.project_id)}">${esc(p.name)} — ${esc(p.genre)}</option>`)
      .join("");
    sel.onchange = () => {
      projectPickers.forEach(prefix => { $(prefix + "-project").value = sel.value; });
      seriesOffset = 0; editorialOffset = 0;
      $("episode-detail").replaceChildren(); $("usage-out").replaceChildren();
      feedback("");
      Object.keys(renderEpoch).forEach(id => renderEpoch[id]++);
      onChange();
    };
    return projects;
  } catch (err) {
    sel.innerHTML = `<option value="">(error)</option>`;
    return { error: err };
  }
}

// ── Runs pane ────────────────────────────────────────────────────────────
let currentEventSource = null;

async function renderRuns() {
  const pid = $("runs-project").value;
  const box = $("runs-status");
  if (!pid) { box.innerHTML = `<div class="empty">${esc(t("common.pickProject"))}</div>`; return; }
  box.innerHTML = `<div class="muted">${esc(t("runs.loading"))}</div>`;

    data = await getJSON(`/console/api/status?project_id=${encodeURIComponent(pid)}`);
  } catch (err) {
    box.innerHTML = errorHTML(t("runs.loadError"), err);
    stopTimeline(t("runs.sseError"));
    return;
  }
  if (!data.run_present || !data.run) {
    box.innerHTML = `<div class="empty">${esc(t("runs.noRun"))}</div>`;
    stopTimeline(t("runs.sseNoRun"));

function renderRunStatus(run) {
  const head = `
    <div class="row" style="margin-bottom:8px">
      <span class="kv" style="font-family:var(--mono)">${esc(run.run_id)}</span>
      ${pill(run.status)}
      <span class="kv">${esc(t("runs.next"))}: ${esc(statusLabel(run.next_action))}</span>
      <span class="kv">${esc(tf("runs.chapterRange", {start: run.start_chapter, end: run.end_chapter}))}</span>
      <span class="kv">${esc(tf("runs.chapterProgress", {done: run.completed_chapter_count, total: run.total_chapter_count}))}</span>
      ${run.blocked_reason ? `<span class="err">${esc(run.blocked_reason)}</span>` : ""}
      ${helpButton("help-runs-checkpoints", "help.runs.checkpoints.title")}
    </div>`;
  const chapters = (run.chapters || []).map((ch) => {
    const scenes = (ch.scenes || []).map((sc) => `
      <div class="scene-cell">
        <div class="lbl">${esc(ch.chapter_number)}.${esc(sc.scene_order)} ${pill(sc.phase)}</div>
        ${sc.mine_status ? `<div class="kv">${esc(t("runs.mine"))}: ${pill(sc.mine_status)} ${esc(sc.mine_detail || "")}</div>` : ""}
        ${sc.verify_status ? `<div class="kv">${esc(t("runs.verify"))}: ${pill(sc.verify_status)} ${esc(sc.verify_detail || "")}</div>` : ""}
        ${sc.revise_attempts ? `<div class="kv">${esc(t("runs.revise"))}: ${esc(sc.revise_attempts)}</div>` : ""}
        ${sc.blocked_reason ? `<div class="err">${esc(sc.blocked_reason)}</div>` : ""}
      </div>`).join("");
    return `
      <div style="margin:10px 0">
        <div style="margin-bottom:6px">${esc(tf("runs.chapter", {n: ch.chapter_number}))} ${pill(ch.status)}
          ${ch.summary_saved ? `<span class="kv">· ${esc(t("runs.summarySaved"))}</span>` : ""}
          ${ch.replan_status ? `<span class="kv">· ${esc(t("runs.replan"))}: ${pill(ch.replan_status)} ${esc(ch.replan_detail || "")}</span>` : ""}
        </div>
        <div class="grid">${scenes || `<span class="empty">${esc(t("runs.noScenes"))}</span>`}</div>
      </div>`;
  }).join("");
  const cps = (run.checkpoint_reports || []).map((cp) => `
    <tr>
      <td>${esc(tf("runs.chapterRange", {start: cp.start_chapter, end: cp.end_chapter}))}</td>
      <td>${pill(cp.status)}</td>
      <td>${cp.checkpoint_policy ? esc(statusLabel(cp.checkpoint_policy)) : esc(t("runs.manual"))}</td>
      <td>${cp.auto_outcome ? pill(cp.auto_outcome) : ""}</td>
      <td class="kv">${esc((cp.pending_manual_scene_ids || []).join(", "))}</td>
    </tr>`).join("");
  const cpTable = cps
    ? `<table><thead><tr><th>${esc(t("runs.colRange"))}</th><th>${esc(t("runs.colStatus"))}</th><th>${esc(t("runs.colPolicy"))}</th><th>${esc(t("runs.colAuto"))}</th><th>${esc(t("runs.colPending"))}</th></tr></thead><tbody>${cps}</tbody></table>`
    : "";
  return head + chapters + (cpTable ? `<div style="margin-top:10px"><strong>${esc(t("runs.checkpoints"))}</strong>${cpTable}</div>` : "");
}

function startTimeline(runId) {
  stopTimeline(t("runs.sseReconnecting"));
  const tl = $("timeline");
  tl.innerHTML = "";
  // The browser's native EventSource handles Last-Event-ID resume for us: on a
  // dropped connection it auto-reconnects, sending the last seq it saw so the
  // server replays only newer rows (ADR 0002 D4).
  const es = new EventSource(`/events?topic=run:${encodeURIComponent(runId)}`);
  currentEventSource = es;
  es.onopen = () => setSse(t("runs.sseLive"));
  es.onerror = () => setSse(t("runs.sseReconnecting")); // EventSource retries automatically
  // Known kinds from ADR 0002 D2. Consumers MUST ignore unknown kinds and
  // unknown payload keys (ADR 0002 D3.2) — a forward-compat rule. We render any
  // kind generically, so a kind added in a later phase shows up without a code
  // change and never breaks the stream.
  const KNOWN = new Set([
    "run_started","scene_drafted","scene_verify_completed","scene_revised",
    "scene_committed","scene_mined","deltas_decided","beats_annotated",
    "chapter_summarized","checkpoint_created","checkpoint_auto_approved",
    "checkpoint_blocked","checkpoint_reviewed","replan_proposed","pass_skipped",
    "run_blocked","run_resumed","run_paused","run_completed",
  ]);
  const handler = (kind) => (e) => appendEvent(e.lastEventId, kind, e.data, KNOWN.has(kind));
  KNOWN.forEach((k) => es.addEventListener(k, handler(k)));
  // Generic listener for any kind not pre-registered (unknown-kind rule):
  es.onmessage = (e) => {
    // Default (unnamed) events only; named events are handled above.
    appendEvent(e.lastEventId, "message", e.data, false);
  };
}

function formatAntiSlop(data) {
  try {
    const obj = typeof data === "string" ? JSON.parse(data) : data;
    const a = obj && obj.anti_slop;
    if (!a || typeof a !== "object") return "";
    const hardIds = Array.isArray(a.hard_ids) && a.hard_ids.length ? a.hard_ids.join(",") : "none";
    const softIds = Array.isArray(a.soft_ids) && a.soft_ids.length ? a.soft_ids.join(",") : "none";
    return `anti_slop hard=${Number(a.hard_count) || 0} soft=${Number(a.soft_count) || 0} hard_ids=${hardIds} soft_ids=${softIds}`;
  } catch (_err) {
    return "";
  }
}

function appendEvent(seq, kind, data, known) {
  const tl = $("timeline");
  const first = tl.querySelector(".empty");
  if (first) tl.innerHTML = "";
  const div = document.createElement("div");
  div.className = "ev" + (known ? "" : " unknown");
  const summary = formatAntiSlop(data);
  div.innerHTML =
    `<span class="seq">#${esc(seq)}</span>` +
    `<span class="kind">${esc(kind)}${known ? "" : " " + esc(t("runs.unknownKind"))}</span>` +
    (summary ? `<span class="as">${esc(summary)}</span>` : "") +
    `<span class="pl">${esc(data)}</span>`;
  tl.appendChild(div); // append-only
  tl.scrollTop = tl.scrollHeight;
}

function setSse(state) { $("sse-state").textContent = state; }
function stopTimeline(state) {
  if (currentEventSource) { currentEventSource.close(); currentEventSource = null; }
  setSse(state || "idle");
}

// ── Manuscript pane ──────────────────────────────────────────────────────
// ~30-line inline Markdown converter: headings + paragraphs only, no library.
// Everything is escaped first, so this can never inject markup from prose.
function renderMarkdown(md) {
  const lines = String(md || "").split("\n");
  let html = "", para = [];
  const flush = () => { if (para.length) { html += `<p>${para.join(" ")}</p>`; para = []; } };
  for (const raw of lines) {
    const line = esc(raw);
    const h = /^(#{1,3})\s+(.*)$/.exec(line);
    if (h) { flush(); const n = h[1].length; html += `<h${n}>${h[2]}</h${n}>`; }
    else if (line.trim() === "") { flush(); }
    else { para.push(line.trim()); }
  }
  flush();
  return html;
}

async function renderManuscript() {
  const pid = $("ms-project").value;

    data = await getJSON(`/console/api/manuscript?project_id=${encodeURIComponent(pid)}&book_number=${book}`);
  } catch (err) { box.innerHTML = errorHTML(t("manuscript.loadError"), err); return; }
  const missing = (data.missing_scenes || []);
  const head = `<div class="row"><span class="kv">${esc(tf("manuscript.summary", {scenes: data.scene_count, words: data.word_count}))}</span>
    ${missing.length ? `<span class="err">${esc(tf("manuscript.undrafted", {count: missing.length, list: missing.join(", ")}))}</span>` : ""}</div>`;
  if (!data.markdown || !data.markdown.trim()) {
    box.innerHTML = head + `<div class="empty">${esc(t("manuscript.empty"))}</div>`;
    return;
  }
  box.innerHTML = head + `<div class="md">${renderMarkdown(data.markdown)}</div>`;
}

async function renderPlan() {

async function renderSettings() {
  const routesBox = $("settings-routes");
  const current = loading("settings-routes", t("settings.loading"));
  let data;
  try {
    data = await getJSON("/console/api/settings");
  } catch (err) {
    $("settings-error").innerHTML = errorHTML(t("settings.loadError"), err);
    return;
  }
  if (!current()) return;
  settingsState = data;
  settingsDirty = false;
  $("settings-config-path").textContent = data.source_path
    ? tf("settings.configPath", {path: data.source_path})
    : t("settings.noConfig");
  $("settings-error").innerHTML = data.config_error
    ? `<div class="note">${esc(data.config_error)}</div>` : "";
  $("settings-fields").innerHTML = "";
  if (!data.document) {
    routesBox.innerHTML = `<div class="empty">${esc(t("settings.documentMissing"))}</div>`;
    $("settings-agents").innerHTML = "";
    settingsStatusText();
    return;
  }
  renderSettingsDocument();

function updateSettingsFromInputs(event) {
  const field = event.target.closest("[data-field]");
  if (!field || !settingsState || !settingsState.document) return false;
  const index = Number(field.dataset.index);
  const agent = (settingsState.document.agents || [])[index];
  if (!agent) return false;
  agent[field.dataset.field] = field.dataset.list === "true"
    ? field.value.split(",").map((value) => value.trim()).filter(Boolean)
    : field.value;
  settingsDirty = true;
  settingsStatusText();
  return true;
}

function updateRoutingFromSelect(event) {
  const select = event.target.closest("[data-route-index]");
  if (!select || !settingsState || !settingsState.document) return false;
  const route = (settingsState.routes || [])[Number(select.dataset.routeIndex)];
  if (!route) return false;
  const rules = settingsState.document.routing || (settingsState.document.routing = []);
  const at = rules.findIndex((rule) => rule.route === route.route_name
    && (rule.rating || null) === (route.rating || null));
  if (!select.value) {
    if (at >= 0) rules.splice(at, 1);
  } else if (at >= 0) {
    rules[at].agent = select.value;
  } else {
    rules.push({ route: route.route_name, agent: select.value, ...(route.rating ? { rating: route.rating } : {}) });
  }
  settingsDirty = true;
  settingsStatusText();
  return true;
}

document.addEventListener("input", updateSettingsFromInputs);
document.addEventListener("change", updateRoutingFromSelect);
document.addEventListener("click", (event) => {
  const remove = event.target.closest("[data-remove-agent]");
  if (!remove || !settingsState || !settingsState.document) return;
  const index = Number(remove.dataset.removeAgent);
  const removed = settingsState.document.agents.splice(index, 1)[0];
  if (removed) {
    settingsState.document.routing = (settingsState.document.routing || [])
      .filter((rule) => rule.agent !== removed.id && rule.fallback !== removed.id);
  }
  settingsDirty = true;
  renderSettingsDocument();
});

// ── Pane switching + wiring ──────────────────────────────────────────────
const paneRenderers = { series: renderSeries, editorial: renderEditorial, threads: renderThreads, runs: renderRuns, manuscript: renderManuscript, canon: renderCanon, plan: renderPlan, settings: renderSettings };

function switchPane(name) {
  activePane = name;
  document.querySelectorAll("nav button").forEach((b) =>
    b.setAttribute("aria-pressed", String(b.dataset.pane === name)));
  document.querySelectorAll(".pane").forEach((p) => p.classList.remove("active"));
  const pane = $("pane-" + name);
  if (pane) pane.classList.add("active");
  // Runs owns the SSE stream; leaving it closes the stream (no background poll).
  if (name !== "runs") stopTimeline("idle");
  // Refetch on pane switch (no polling loops except the SSE stream itself).
  const r = paneRenderers[name];
  if (r) r();
}

document.querySelectorAll("nav button").forEach((b) =>
  b.addEventListener("click", () => switchPane(b.dataset.pane)));

$("runs-refresh").addEventListener("click", renderRuns);
$("ms-refresh").addEventListener("click", renderManuscript);
$("canon-refresh").addEventListener("click", renderCanon);
$("plan-refresh").addEventListener("click", renderPlan);
$("settings-refresh").addEventListener("click", renderSettings);
$("settings-reload").addEventListener("click", renderSettings);
$("settings-add-agent").addEventListener("click", () => {
  if (!settingsState || !settingsState.document) return;
  const agents = settingsState.document.agents || (settingsState.document.agents = []);
  const index = agents.length + 1;
  agents.push({ id: `agent-${index}`, name: `Agent ${index}`, provider: "openai-compatible", endpoint: "", model: "", ratings: [], capabilities: [] });
  settingsDirty = true;
  renderSettingsDocument();
});
$("settings-save").addEventListener("click", (event) => perform(event.currentTarget, async () => {
  if (!settingsState || !settingsState.document) return;
  const response = await fetch("/console/api/settings", {
    method: "POST",
    headers: {"content-type": "application/json"},
    body: JSON.stringify({expected_revision: settingsState.revision, config: settingsState.document}),
  });
  const body = await response.json().catch(() => ({}));
  if (response.status === 409) { feedback(t("settings.stale"), true); return; }
  if (response.status === 400) {
    $("settings-fields").innerHTML = (body.errors || [])
      .map((error) => `<div class="err">${esc(t("settings.field"))} ${esc(error.field)}: ${esc(error.message)}</div>`)
      .join("");
    feedback(t("settings.invalid"), true);
    return;
  }
  if (!response.ok) throw new Error(body.error || `Save failed (${response.status})`);
  feedback(tf("settings.saved", {
    agents: body.agents_loaded, rules: body.routing_rules_loaded,
    backup: body.backup_path || "—",
  }));
  await renderSettings();
}));

$("series-refresh").onclick = () => renderSeries();
$("editorial-refresh").onclick = () => renderEditorial();
$("editorial-filter").onchange = () => { editorialOffset = 0; renderEditorial(); };
$("threads-refresh").onclick = renderThreads;
$("usage").addEventListener("toggle", () => { if ($("usage").open) renderUsage(); });

// Boot all project pickers before rendering the initial series view.
(async function boot() {
  lang = storedLang();
  applyLanguage();
  await Promise.all([
    loadProjects("series-project", () => renderSeries()),
    loadProjects("editorial-project", () => renderEditorial()),
    loadProjects("threads-project", renderThreads),
    loadProjects("runs-project", renderRuns),
    loadProjects("ms-project", renderManuscript),
    loadProjects("canon-project", renderCanon),
    loadProjects("plan-project", renderPlan),
  ]);
  renderSeries();
  booted = true;
})();
</script>
</body>
