version = 1
name = "story-structure"
profiles = ["default"]
requires_skills = ["spindle"]
tools = ["get_entity", "planning_advance", "planning_begin", "planning_decide", "planning_status"]

[[references]]
name = "story-spine"
path = "references/story-spine.md"
trigger = "Load when writing, reviewing, or questioning a Story Spine (series or book sub-spine), its ending type, or its Central Question / Controlling Idea / Counter-Idea / Spine Axis."
profiles = ["default"]
tools = []

[[references]]
name = "character-design"
path = "references/character-design.md"
trigger = "Load when designing or repairing a character's Character Design (contradictions, the four layers of self, conscious and unconscious desire, pressure on the protagonist, behaviour cues) or when deciding whether an arc milestone is a change or a reveal."
profiles = ["default"]
tools = []

[[references]]
name = "value-turns"
path = "references/value-turns.md"
trigger = "Load when judging or repairing a Value Turn, a Charge, a Gap, a broken value chain, or whether a Scene, Sequence or Act actually turns the Spine Axis, including Act climax Charges, depth progression and the reserved Act climax placeholder."
profiles = ["default"]
tools = []

[[references]]
name = "scene-design"
path = "references/scene-design.md"
trigger = "Load when designing or repairing a planned Scene: its Value Axis pressure, opposition, Scene Question, Gap, Turning Beat, Inaction Cost and structured Beats."
profiles = ["default"]
tools = []

[[references]]
name = "dialogue-tactics"
path = "references/dialogue-tactics.md"
trigger = "Load when designing or repairing dialogue as action: tactic, said versus wanted (subtext), Beats inside dialogue, the Turning Beat's line, and Swain labels as optional labels only."
profiles = ["default"]
tools = []

[[references]]
name = "dialogue-line"
path = "references/dialogue-line.md"
trigger = "Load when the dialogue tactics are already decided and the line itself needs work: subtext, exposition used as ammunition rather than explanation, over-obvious foreshadowing, and line-level compression."
profiles = ["default"]
tools = []
